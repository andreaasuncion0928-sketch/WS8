<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Andy &amp; Lance · Our Wedding Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #4b3652; 
  --ink2: #6e5d70; 
  --paper: #f1e6d5; 
  --lav: #8c6ea6; 
  --deep: #5a4270; 
  --rule: #b9a48f;
  --script: 'Mrs Saint Delafield', 'Pinyon Script', 'Snell Roundhand', cursive;
  --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  
  /* Paste your long background image urls here */
  --intro-b: url(YOUR_BASE64_IMAGE_HERE);
  --intro-p: url(YOUR_BASE64_IMAGE_HERE);
  --p2-b: url(YOUR_BASE64_IMAGE_HERE);
  --p3-b: url(YOUR_BASE64_IMAGE_HERE);
  --p4-b: url(YOUR_BASE64_IMAGE_HERE);
}

/* 1. ADJUSTMENT: Body padding prevents content and image borders from hiding under the fixed menu bar */
body {
    margin: 0;
    font-family: var(--serif);
    background-color: var(--paper);
    color: var(--ink);
    padding-top: 100px; /* Pushes everything down to clear the menu */
}

/* Example styling for a fixed menu bar */
.menu-bar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 70px;
    background-color: var(--deep);
    color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    font-size: 1.2rem;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

/* Container for your content and image borders */
.content-wrapper {
    max-width: 900px;
    margin: 0 auto 50px auto;
    padding: 40px;
    border: 2px solid var(--rule); /* The border you mentioned */
    background-color: #fff;
    min-height: 80vh;
}

/* 2. ADJUSTMENT: Moving the quote to the right for readability */
.hero-quote {
    font-family: var(--script);
    font-size: 3rem;
    color: var(--ink);
    margin-left: auto;     /* Pushes the text block to the right */
    margin-right: 5%;      /* Keeps it from touching the right border completely */
    max-width: 60%;        /* Prevents the text from stretching too wide */
    text-align: right;     /* Aligns the text lines to the right */
    line-height: 1.1;
    margin-top: 20px;
    margin-bottom: 40px;
}

h1 {
    text-align: center;
    font-size: 2.5rem;
    font-weight: 500;
    color: var(--deep);
    margin-bottom: 10px;
}
</style>
</head>
<body>

<!-- Menu Bar -->
<nav class="menu-bar">
    Our Wedding Journal
</nav>

<!-- Main Page Content -->
<main class="content-wrapper">
    
    <h1>Andy &amp; Lance</h1>
    
    <!-- The adjusted quote -->
    <div class="hero-quote">
        A journey of unexpected timing,<br>
        and a love that stayed.
    </div>

    <!-- The rest of your images and text can continue down here safely below the menu -->
    
</main>

</body>
</html>
